      <stop offset=".28" stop-color="#a52d25"/>
      <stop offset=".68" stop-color="#741b19"/>
      <stop offset="1" stop-color="#3b100f"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
